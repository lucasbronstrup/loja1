<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Minoran — s04 nuances</title>
    <link rel="preload" href="vendor/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="vendor/fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="shared/palette.css" />
    <link rel="stylesheet" href="shared/base.css" />
  </head>
  <body>
    <div id="s04-root" data-composition-id="s04-nuances" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <style>
        [data-composition-id="s04-nuances"] {
          position: relative;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: var(--mn-strap-creme-bg);
        }
        [data-composition-id="s04-nuances"] .s04-irisbg {
          position: absolute;
          inset: 0;
          background: var(--mn-ink);
        }
        [data-composition-id="s04-nuances"] .s04-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        [data-composition-id="s04-nuances"] .s04-block {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        [data-composition-id="s04-nuances"] .s04-cam {
          position: absolute;
          inset: 0;
        }
        [data-composition-id="s04-nuances"] .s04-bg {
          position: absolute;
          inset: -40px;
        }
        [data-composition-id="s04-nuances"] #s04-bg1 {
          background: radial-gradient(ellipse 1100px 820px at 1300px 540px, #f6e7b8 0%, #e6c98a 34%, #d9b76a 55%, #b8893b 100%);
        }
        [data-composition-id="s04-nuances"] #s04-bg2 {
          background: radial-gradient(ellipse 1050px 800px at 1300px 540px, #fdfbf7 0%, #f1eef2 40%, #e3e3ea 70%, #d5dce0 100%);
        }
        [data-composition-id="s04-nuances"] #s04-bg2::after {
          content: "";
          position: absolute;
          inset: 0;
          background: conic-gradient(from 200deg at 1300px 540px, rgba(255, 214, 226, 0.18), rgba(208, 228, 255, 0.18), rgba(255, 246, 214, 0.18), rgba(214, 255, 240, 0.14), rgba(255, 214, 226, 0.18));
          mix-blend-mode: soft-light;
        }
        [data-composition-id="s04-nuances"] #s04-bg3 {
          background: radial-gradient(ellipse 1050px 820px at 1300px 540px, #2f6a53 0%, #23523f 38%, #1e4a3a 60%, #12311f 100%);
        }
        [data-composition-id="s04-nuances"] .s04-shadow {
          position: absolute;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(30, 22, 12, 1) 0%, rgba(30, 22, 12, 0.5) 55%, rgba(30, 22, 12, 0) 100%);
          mix-blend-mode: multiply;
          opacity: 0.25;
        }
        [data-composition-id="s04-nuances"] .s04-prod {
          position: absolute;
        }
        [data-composition-id="s04-nuances"] .s04-prod img {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        [data-composition-id="s04-nuances"] .s04-sheen {
          position: absolute;
          inset: 0;
          -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
          mix-blend-mode: screen;
          overflow: hidden;
        }
        [data-composition-id="s04-nuances"] .s04-band {
          position: absolute;
          top: -20%;
          left: 0;
          width: 28%;
          height: 140%;
          background: linear-gradient(100deg, rgba(255, 250, 238, 0) 0%, rgba(255, 250, 238, 0.7) 50%, rgba(255, 250, 238, 0) 100%);
          opacity: 0;
        }
        [data-composition-id="s04-nuances"] .s04-streak {
          position: absolute;
          left: -320px;
          top: -180px;
          width: 2560px;
          height: 1440px;
          mix-blend-mode: screen;
          opacity: 0;
          -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 4%, #000 30%, #000 70%, rgba(0, 0, 0, 0) 96%);
          mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 4%, #000 30%, #000 70%, rgba(0, 0, 0, 0) 96%);
        }
        [data-composition-id="s04-nuances"] .s04-header {
          position: absolute;
          left: 96px;
          top: 80px;
          color: var(--mn-ink);
        }
        [data-composition-id="s04-nuances"] .s04-title {
          font-size: 76px;
          margin-top: 22px;
          white-space: nowrap;
          padding-bottom: 0.1em;
        }
        [data-composition-id="s04-nuances"] .s04-caps {
          position: absolute;
          left: 96px;
          top: 760px;
          width: 1000px;
          height: 150px;
          color: var(--mn-ink);
        }
        [data-composition-id="s04-nuances"] .s04-cap {
          position: absolute;
          left: 0;
          top: 0;
          font-size: 120px;
          white-space: nowrap;
          padding-bottom: 0.12em;
        }
        [data-composition-id="s04-nuances"] .s04-progress {
          position: absolute;
          left: 96px;
          top: 940px;
          width: 420px;
          height: 2px;
          background: rgba(18, 16, 14, 0.18);
        }
        [data-composition-id="s04-nuances"] .s04-fill {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          background: currentColor;
          transform-origin: 0 50%;
        }
        [data-composition-id="s04-nuances"] .s04-count {
          position: absolute;
          left: 540px;
          top: 925px;
          font-family: "Poppins", Arial, sans-serif;
          font-weight: 500;
          font-size: 22px;
          letter-spacing: 0.3em;
          line-height: 30px;
          height: 30px;
          white-space: nowrap;
          color: var(--mn-ink);
        }
        [data-composition-id="s04-nuances"] .s04-odo {
          display: inline-block;
          vertical-align: top;
        }
        [data-composition-id="s04-nuances"] .s04-svg {
          position: absolute;
          width: 0;
          height: 0;
        }
      </style>

      <div id="s04-main" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="s04-irisbg"></div>
        <div class="s04-stage" id="s04-stage">
          <svg class="s04-svg" aria-hidden="true">
            <defs>
              <clipPath id="s04-clip2" clipPathUnits="userSpaceOnUse"><path id="s04-blob2" d="" /></clipPath>
              <clipPath id="s04-clip3" clipPathUnits="userSpaceOnUse"><path id="s04-blob3" d="" /></clipPath>
            </defs>
          </svg>
          <div class="s04-block" id="s04-b1">
            <div class="s04-cam" id="s04-cam1">
              <div class="s04-bg" id="s04-bg1"></div>
              <div class="s04-shadow" id="s04-sh1"></div>
              <div class="s04-prod" id="s04-p1"><img src="assets/cut/doree_blanc.png" alt="" /><div class="s04-sheen" id="s04-sheen1"><div class="s04-band" id="s04-band1"></div></div></div>
            </div>
          </div>
          <div class="s04-block" id="s04-b2" style="clip-path: url(#s04-clip2)">
            <div class="s04-cam" id="s04-cam2">
              <div class="s04-bg" id="s04-bg2"></div>
              <div class="s04-shadow" id="s04-sh2"></div>
              <div class="s04-prod" id="s04-p2"><img src="assets/cut/rect_argentee_34.png" alt="" /><div class="s04-sheen" id="s04-sheen2"><div class="s04-band" id="s04-band2"></div></div></div>
            </div>
          </div>
          <div class="s04-block" id="s04-b3" style="clip-path: url(#s04-clip3)">
            <div class="s04-cam" id="s04-cam3">
              <div class="s04-bg" id="s04-bg3"></div>
              <div class="s04-shadow" id="s04-sh3"></div>
              <div class="s04-prod" id="s04-p3"><img src="assets/cut/doree_vert.png" alt="" /><div class="s04-sheen" id="s04-sheen3"><div class="s04-band" id="s04-band3"></div></div></div>
            </div>
            <img class="s04-streak" id="s04-streak" src="assets/tex/leak_streak.png" alt="" />
          </div>
          <!-- topo fixo -->
          <div class="s04-header" id="s04-header">
            <p class="mn-kicker" id="s04-kicker">Trois nuances, votre signature</p>
            <h2 class="mn-serif s04-title" id="s04-title">Une couleur, une personnalité.</h2>
          </div>
          <!-- legendas -->
          <div class="s04-caps" id="s04-caps" data-layout-allow-overlap>
            <h3 class="mn-serif s04-cap" id="s04-cap1" data-layout-allow-overlap>L’éclat du doré.</h3>
            <h3 class="mn-serif s04-cap" id="s04-cap2" data-layout-allow-overlap>La ligne argentée.</h3>
            <h3 class="mn-serif s04-cap" id="s04-cap3" data-layout-allow-overlap>Le caractère du vert.</h3>
          </div>
          <div class="s04-progress" id="s04-progress"><div class="s04-fill" id="s04-fill"></div></div>
          <div class="s04-count" id="s04-count"><span class="s04-odo" id="s04-odo" data-layout-ignore></span><span> / 03</span></div>
        </div>
      </div>

      <script src="vendor/gsap.min.js"></script>
      <script src="vendor/SplitText.min.js"></script>
      <script src="vendor/CustomEase.min.js"></script>
      <script src="vendor/DrawSVGPlugin.min.js"></script>
      <script src="vendor/MorphSVGPlugin.min.js"></script>
      <script src="shared/timeline.js"></script>
      <script src="shared/framing.js"></script>
      <script src="shared/palette.js"></script>
      <script src="shared/fx.js"></script>
      <script>
        (function () {
          var ID = "s04-nuances";
          MN.init();
          var S = MN.scene(ID);
          var C = S.cue;
          var FR = window.MINORAN_FRAMING;
          var P0 = window.MINORAN_TL.transitions["s03>s04"].point; // íris abre do mesmo ponto do s03
          var CX = P0[0],
            CY = P0[1] + 10;

          function place(el, key, s, at) {
            var f = FR[key];
            var crop = f.cut.cropPx;
            var w = crop[2] * s,
              h = crop[3] * s;
            var dx = (f.watch.cx * f.size[0] - crop[0]) * s;
            var dy = (f.watch.cy * f.size[1] - crop[1]) * s;
            el.style.width = w + "px";
            el.style.height = h + "px";
            el.style.left = at[0] - dx + "px";
            el.style.top = at[1] - dy + "px";
            return { w: w, h: h, dx: dx, dy: dy, left: at[0] - dx, top: at[1] - dy };
          }
          function shadow(el, g, k, up) {
            var sw = g.w * k,
              sh = 50;
            el.style.width = sw + "px";
            el.style.height = sh + "px";
            el.style.left = g.left + (g.w - sw) / 2 + "px";
            el.style.top = g.top + g.h - sh * (up || 0.6) + "px";
          }
          // escalas: mostradores do mesmo tamanho aparente; pico (1.12 x 1.06) <= maxScale
          var base = 0.66;
          var r1 = FR.doree_blanc.watch.rx * FR.doree_blanc.size[0];
          var g1 = place(S.q("#s04-p1"), "doree_blanc", base, [CX, CY]);
          // a trois-quarts mostra pouca pulseira: mostrador 35 % maior para o mesmo peso visual
          var g2 = place(S.q("#s04-p2"), "rect_argentee_34", (1.35 * base * r1) / (FR.rect_argentee_34.watch.rx * FR.rect_argentee_34.size[0]), [CX, CY]);
          var g3 = place(S.q("#s04-p3"), "doree_vert", (base * r1) / (FR.doree_vert.watch.rx * FR.doree_vert.size[0]), [CX, CY]);
          shadow(S.q("#s04-sh1"), g1, 0.95);
          shadow(S.q("#s04-sh3"), g3, 0.85);
          // a foto trois-quarts é recortada pelo próprio enquadramento: bordas da pulseira em fade
          var p2 = S.q("#s04-p2");
          p2.style.webkitMaskImage = p2.style.maskImage = "radial-gradient(ellipse 50% 50% at " + (g2.dx / g2.w) * 100 + "% " + (g2.dy / g2.h) * 100 + "%, #000 62%, rgba(0,0,0,0) 100%)";
          S.q("#s04-sh2").style.display = "none";
          [["#s04-sheen1", "doree_blanc"], ["#s04-sheen2", "rect_argentee_34"], ["#s04-sheen3", "doree_vert"]].forEach(function (a) {
            var el = S.q(a[0]);
            el.style.webkitMaskImage = el.style.maskImage = "url(assets/cut/" + a[1] + ".png)";
          });
          // blobs do wipe líquido (mesma estrutura: interpolação ponto a ponto)
          var BIG = 1750;
          S.q("#s04-blob2").setAttribute("d", MN.blobPath(CX, CY, 1, { seed: 42, n: 16, amp: 0.09 }));
          S.q("#s04-blob3").setAttribute("d", MN.blobPath(CX, CY, 1, { seed: 77, n: 16, amp: 0.09 }));

          MN.fonts(['400 italic 120px "Instrument Serif"', '400 italic 76px "Instrument Serif"', '500 22px "Poppins"']).then(function () {
            var tl = gsap.timeline({ paused: true });
            var D = S.dur;
            var stage = S.q("#s04-stage");
            var INK = "#12100E",
              IVORY = "#F5F0E8";

            // IN: íris abre do mesmo ponto do s03 (sobre tinta)
            var inn = C("in");
            MN.iris(tl, stage, { at: inn[0], dur: inn[1] - inn[0], cx: P0[0], cy: P0[1], r0: 0, r1: 1440, ease: "power2.out" });
            tl.set(stage, { clipPath: "none" }, inn[1] + 0.01);

            // cabeçalho fixo
            var hd = C("header");
            MN.trackingIn(tl, S.q("#s04-kicker"), { at: hd, from: 0.5, to: 0.32, dur: 0.8 });
            var tt = MN.split(S.q("#s04-title"), "words");
            MN.splitReveal(tl, tt.chars, { at: hd + 0.12, dur: 0.7, stagger: 0.022 });
            tl.fromTo("#s04-header", { x: 0 }, { x: -18, duration: D, ease: "none", immediateRender: true }, 0);

            // blocos
            var B = C("blocks");
            var WD = C("wipe");
            var caps = [MN.split(S.q("#s04-cap1"), "words"), MN.split(S.q("#s04-cap2"), "words"), MN.split(S.q("#s04-cap3"), "words")];
            var prods = ["#s04-p1", "#s04-p2", "#s04-p3"];
            var odo = MN.odometer(S.q("#s04-odo"), 2, 30);
            MN.odoInit(odo, 1);
            tl.fromTo("#s04-count", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out", immediateRender: true }, 0.3);
            tl.fromTo("#s04-progress", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out", immediateRender: true }, 0.3);

            B.forEach(function (t0, i) {
              var p = prods[i];
              // o relógio novo entra de 1.12 -> 1, de +8° -> 0 (o primeiro nasce com a íris)
              gsap.set(p, { transformOrigin: [g1, g2, g3][i].dx + "px " + [g1, g2, g3][i].dy + "px" });
              tl.fromTo(p, { scale: 1.12, rotation: 8 }, { scale: 1, rotation: 0, duration: i === 0 ? 0.7 : WD, ease: "mn.inOut", immediateRender: true }, t0);
              // deriva lenta (nada parado)
              tl.fromTo(p, { y: 0 }, { y: -14, duration: 2, ease: "none", immediateRender: true }, t0);
              // glint no meio do bloco
              MN.glint(tl, S.q("#s04-band" + (i + 1)), { at: t0 + 0.75, dur: 0.85, fromX: -150, toX: 380, peak: i === 1 ? 0.8 : 0.6 });
              // legenda
              MN.splitReveal(tl, caps[i].chars, { at: t0 + (i === 0 ? 0.15 : 0.12), dur: 0.65, stagger: 0.022 });
              if (i < 2) {
                var tNext = B[i + 1];
                // o relógio antigo vai de 1 para 0.86, girando -8°
                tl.to(p, { scale: 0.86, rotation: -8, duration: WD, ease: "mn.inOut" }, tNext);
                MN.textOut(tl, caps[i].chars, { at: tNext - 0.05, stagger: 0.006, dur: 0.3 });
                // wipe circular líquido saindo do relógio
                var blob = S.q("#s04-blob" + (i + 2));
                tl.to(blob, { morphSVG: { shape: MN.blobPath(CX, CY, BIG, { seed: i === 0 ? 42 : 77, n: 16, amp: 0.09, rot: 0.5 }), map: "position" }, duration: WD, ease: "mn.inOut" }, tNext);
                MN.odoSet(tl, odo, i + 2, tNext, 0.5, "back.out(1.4)");
              }
              // linha de progresso enchendo a cada compasso
              tl.fromTo("#s04-fill", { scaleX: i / 3 }, { scaleX: (i + 1) / 3, duration: 2, ease: "none", immediateRender: i === 0 }, t0);
            });
            // cor do texto troca no verde profundo (marfim sobre verde)
            var tg = B[2];
            tl.to(["#s04-header", "#s04-caps", "#s04-count", "#s04-fill"], { color: IVORY, duration: WD, ease: "mn.inOut" }, tg);
            tl.to("#s04-progress", { backgroundColor: "rgba(245,240,232,0.25)", duration: WD, ease: "mn.inOut" }, tg);
            tl.set("#s04-fill", { backgroundColor: "currentColor" }, 0);

            // build (4–6): micro-zoom acelerando 1 -> 1.06, streaks crescendo; congela em 5.5
            var bd = C("build");
            gsap.set("#s04-cam3", { transformOrigin: CX + "px " + CY + "px" });
            tl.fromTo("#s04-cam3", { scale: 1 }, { scale: 1.06, duration: bd[1] - bd[0], ease: "power2.in", immediateRender: true }, bd[0]);
            gsap.set("#s04-streak", { transformOrigin: "50% 50%", y: CY - 0.46 * 1440 + 180 });
            tl.fromTo("#s04-streak", { opacity: 0, scaleX: 0.35 }, { opacity: 0.9, scaleX: 1.5, duration: bd[1] - bd[0], ease: "power2.in", immediateRender: true }, bd[0]);

            // 5.5: congela — os textos saem no silêncio (gap), antes do whip
            var fz = C("freeze");
            MN.textOut(tl, ["#s04-header", "#s04-caps", "#s04-count", "#s04-progress"], { at: fz, stagger: 0.02, dur: 0.22 });

            // 5.75–6.0: OUT — whip para cima, revelando crème
            var out = C("out");
            var defs = MN.defs(S.q("#s04-main"), "s04");
            var by = MN.blurFilter(defs, "s04-mby", "y");
            MN.whipOut(tl, stage, { at: out[0], dur: out[1] - out[0], axis: "y", dist: -1400, blur: by, maxBlur: 60 });

            window.__timelines[ID] = tl;
          });
        })();
      </script>
    </div>
  </body>
</html>
