<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Minoran — s02 élégance</title>
    <link rel="preload" href="vendor/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="vendor/fonts/poppins-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="vendor/fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="shared/palette.css" />
    <link rel="stylesheet" href="shared/base.css" />
  </head>
  <body>
    <div id="s02-root" data-composition-id="s02-elegance" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <style>
        [data-composition-id="s02-elegance"] {
          position: relative;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: var(--mn-ivory);
        }
        [data-composition-id="s02-elegance"] .s02-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        [data-composition-id="s02-elegance"] .s02-bg {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 900px 700px at 420px 520px, #1d1915 0%, #14110f 55%, #0f0d0b 100%);
        }
        [data-composition-id="s02-elegance"] .s02-leak {
          position: absolute;
          left: -320px;
          top: -180px;
          width: 2560px;
          height: 1440px;
          opacity: 0.2;
        }
        [data-composition-id="s02-elegance"] .s02-panel {
          position: absolute;
          left: 840px;
          top: 0;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 0px, #000 190px);
          mask-image: linear-gradient(90deg, rgba(0, 0, 0, 0) 0px, #000 190px);
        }
        /* scrim só sobre a placa (fundo): a mesa recua, o sujeito continua iluminado */
        [data-composition-id="s02-elegance"] .s02-scrim {
          position: absolute;
          inset: 0;
          background: linear-gradient(90deg, rgba(18, 16, 14, 0.9) 0px, rgba(18, 16, 14, 0.72) 260px, rgba(18, 16, 14, 0.25) 620px, rgba(18, 16, 14, 0.08) 1080px),
            linear-gradient(0deg, rgba(18, 16, 14, 0.55) 0px, rgba(18, 16, 14, 0) 420px);
        }
        [data-composition-id="s02-elegance"] .s02-pic {
          position: absolute;
          left: -27px;
          top: -27px;
          width: 1134px;
          height: 1134px;
        }
        [data-composition-id="s02-elegance"] .s02-pic img {
          position: absolute;
          left: 0;
          top: 0;
          width: 1134px;
          height: 1134px;
          display: block;
        }
        [data-composition-id="s02-elegance"] .s02-glint {
          position: absolute;
          left: 0;
          top: 0;
          width: 1134px;
          height: 1134px;
          -webkit-mask-image: url(assets/masks/hero_watch.png);
          mask-image: url(assets/masks/hero_watch.png);
          -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
          mix-blend-mode: screen;
          overflow: hidden;
        }
        [data-composition-id="s02-elegance"] .s02-band {
          position: absolute;
          left: 470px;
          top: 380px;
          width: 150px;
          height: 300px;
          background: linear-gradient(100deg, rgba(255, 246, 222, 0) 0%, rgba(255, 246, 222, 0.85) 50%, rgba(255, 246, 222, 0) 100%);
          transform-origin: 50% 50%;
          opacity: 0;
        }
        [data-composition-id="s02-elegance"] .s02-word {
          position: absolute;
          left: 96px;
          top: 604px;
          font-size: 300px;
          color: rgba(245, 240, 232, 0.92);
          white-space: nowrap;
          line-height: 1;
        }
        [data-composition-id="s02-elegance"] .s02-word .mn-w-mask {
          padding: 0.12em 0.08em 0.2em;
          margin: -0.12em -0.08em -0.2em;
        }
        [data-composition-id="s02-elegance"] .s02-kicker {
          position: absolute;
          left: 96px;
          top: 80px;
          color: var(--mn-ivory);
          font-size: 20px;
          white-space: nowrap;
        }
        [data-composition-id="s02-elegance"] .s02-support {
          position: absolute;
          left: 96px;
          top: 148px;
          color: var(--mn-ivory);
        }
        [data-composition-id="s02-elegance"] .s02-support p {
          font-size: 40px;
          line-height: 1.3;
          white-space: nowrap;
        }
        [data-composition-id="s02-elegance"] .s02-bokeh {
          position: absolute;
          inset: 0;
          mix-blend-mode: screen;
        }
        [data-composition-id="s02-elegance"] .s02-flash {
          position: absolute;
          inset: 0;
          background: var(--mn-ivory-flash);
        }
      </style>

      <div id="s02-main" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="s02-stage" id="s02-stage">
          <div class="s02-bg"></div>
          <img class="s02-leak mn-screen" id="s02-leak" src="assets/tex/leak_gold.png" alt="" />
          <!-- 1. foto (placa limpa: o sujeito vem do recorte, em registro perfeito) -->
          <div class="s02-panel">
            <div class="s02-pic" id="s02-photo"><img src="assets/img/hero_plate.jpg" alt="" /></div>
            <div class="s02-scrim"></div>
          </div>
          <!-- 2. palavra atrás do sujeito -->
          <h1 class="mn-serif s02-word" id="s02-word" data-layout-allow-occlusion data-layout-allow-overflow>L’élégance</h1>
          <!-- 3. recorte da modelo + 4. glint no relógio -->
          <div class="s02-panel" data-layout-allow-occlusion>
            <div class="s02-pic" id="s02-cut">
              <img src="assets/cut/hero.png" alt="" data-layout-allow-occlusion />
              <div class="s02-glint"><div class="s02-band" id="s02-band"></div></div>
            </div>
          </div>
          <!-- 5. textos -->
          <p class="mn-kicker s02-kicker" id="s02-kicker">Montres femme · Minoran</p>
          <div class="s02-support" id="s02-support">
            <p class="mn-support" id="s02-s1">Du caractère,</p>
            <p class="mn-support" id="s02-s2">au quotidien.</p>
          </div>
          <!-- 6. bokeh dourado -->
          <div class="s02-bokeh" id="s02-bokeh" data-layout-ignore></div>
        </div>
        <div class="s02-flash" id="s02-flash"></div>
      </div>

      <script src="vendor/gsap.min.js"></script>
      <script src="vendor/SplitText.min.js"></script>
      <script src="vendor/CustomEase.min.js"></script>
      <script src="vendor/DrawSVGPlugin.min.js"></script>
      <script src="vendor/MorphSVGPlugin.min.js"></script>
      <script src="shared/timeline.js"></script>
      <script src="shared/framing.js"></script>
      <script src="shared/palette.js"></script>
      <script src="shared/fx.js"></script>
      <script>
        (function () {
          var ID = "s02-elegance";
          MN.init();
          var S = MN.scene(ID);
          var C = S.cue;
          var F = window.MINORAN_FRAMING.hero;
          var P = 1134; // px exibidos da foto (arquivo 1442 -> 0.786; pico 0.786 x 1.09 = 0.857 <= maxScale)
          var OX = F.watch.cx * P,
            OY = F.watch.cy * P; // push-in/parallax com origem no relógio (ponto focal do produto)

          MN.fonts(['400 italic 300px "Instrument Serif"', '300 40px "Poppins"', '500 20px "Poppins"']).then(function () {
            var tl = gsap.timeline({ paused: true });
            var D = S.dur;
            var stage = S.q("#s02-stage");

            // IN: nasce do marfim (flash decai em 0.3 s) e escala 1.18 -> 1
            var inn = C("in");
            tl.fromTo(stage, { scale: 1.18 }, { scale: 1, transformOrigin: "50% 50%", duration: inn[1] - inn[0], ease: "mn.out", immediateRender: true }, inn[0]);
            MN.flash(tl, S.q("#s02-flash"), { at: inn[0], dur: inn[1] - inn[0], from: 1, to: 0, ease: "power2.out" });

            // parallax 2.5D ao longo dos 6 s
            var o = OX + "px " + OY + "px";
            tl.fromTo("#s02-photo", { scale: 1, x: 0 }, { scale: 1.06, x: -30, transformOrigin: o, duration: D, ease: "none", immediateRender: true }, 0);
            tl.fromTo("#s02-word", { x: 40 }, { x: -40, duration: D, ease: "none", immediateRender: true }, 0);
            tl.fromTo("#s02-cut", { scale: 1, x: 0 }, { scale: 1.09, x: -60, transformOrigin: o, duration: D, ease: "none", immediateRender: true }, 0);
            tl.fromTo("#s02-leak", { x: -70, scale: 1.04 }, { x: 80, scale: 1.12, duration: D, ease: "none", immediateRender: true }, 0);

            // 0.25: kicker (tracking .6em -> .32em)
            MN.trackingIn(tl, S.q("#s02-kicker"), { at: C("kicker"), from: 0.6, to: 0.32, dur: 0.9 });

            // 0.5–1.5: "L’élégance" por caractere
            var w = MN.split(S.q("#s02-word"), "words");
            // a palavra passa atrás do sujeito de propósito (no máximo ~25 % encoberta)
            w.chars.forEach(function (c) {
              c.setAttribute("data-layout-allow-occlusion", "");
              c.setAttribute("data-layout-allow-overlap", "");
            });
            var wr = C("word");
            tl.fromTo(
              w.chars,
              { yPercent: 40, rotationX: -70, filter: "blur(16px)", opacity: 0, transformPerspective: 700, transformOrigin: "50% 100%" },
              { yPercent: 0, rotationX: 0, filter: "blur(0px)", opacity: 1, duration: wr[1] - wr[0] - 0.035 * (w.chars.length - 1), ease: "mn.out", stagger: 0.035, immediateRender: true },
              wr[0],
            );

            // 2.0: glint no relógio
            tl.set("#s02-band", { rotation: 18 }, 0);
            MN.glint(tl, S.q("#s02-band"), { at: C("glint"), dur: 0.85, fromX: -260, toX: 260, peak: 1 });

            // 2.5 / 3.0: frases de apoio por máscara
            var a1 = MN.split(S.q("#s02-s1"), "words");
            var a2 = MN.split(S.q("#s02-s2"), "words");
            MN.splitReveal(tl, a1.words, { at: C("support1"), dur: 0.7, stagger: 0.08 });
            MN.splitReveal(tl, a2.words, { at: C("support2"), dur: 0.7, stagger: 0.08 });

            // bokeh dourado: 18 partículas semeadas
            MN.bokehField(tl, S.q("#s02-bokeh"), { count: 18, seed: 2026, w: 1920, h: 1080, size: [36, 150], opacity: [0.12, 0.42], drift: [70, 40], rise: 30, dur: D });

            // 5.25: textos saem
            var to = C("textOut");
            MN.textOut(tl, w.chars, { at: to, stagger: 0.012, dur: 0.34 });
            MN.textOut(tl, a1.chars.concat(a2.chars), { at: to, stagger: { amount: 0.12 }, dur: 0.32 });
            MN.textOut(tl, "#s02-kicker", { at: to, stagger: 0, dur: 0.3 });
            tl.set(["#s02-support", "#s02-word"], { opacity: 0 }, C("out")[0] - 0.01);

            // 5.72–6.0: OUT — whip à esquerda (x 0 -> -2200, 0.28 s) sobre marfim
            var out = C("out");
            var defs = MN.defs(S.q("#s02-main"), "s02");
            var bx = MN.blurFilter(defs, "s02-mbx", "x");
            MN.whipOut(tl, stage, { at: out[0], dur: out[1] - out[0], axis: "x", dist: -2200, blur: bx, maxBlur: 70 });

            window.__timelines[ID] = tl;
          });
        })();
      </script>
    </div>
  </body>
</html>
