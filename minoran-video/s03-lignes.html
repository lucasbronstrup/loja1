<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Minoran — s03 lignes</title>
    <link rel="preload" href="vendor/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="vendor/fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="shared/palette.css" />
    <link rel="stylesheet" href="shared/base.css" />
  </head>
  <body>
    <div id="s03-root" data-composition-id="s03-lignes" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <style>
        [data-composition-id="s03-lignes"] {
          position: relative;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: var(--mn-ink);
        }
        [data-composition-id="s03-lignes"] .s03-iris {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--mn-ivory);
        }
        [data-composition-id="s03-lignes"] .s03-paper {
          position: absolute;
          inset: 0;
          background-image: url(assets/tex/paper.png);
          background-size: 1024px 1024px;
          mix-blend-mode: multiply;
          opacity: 0.06;
        }
        [data-composition-id="s03-lignes"] .s03-stage {
          position: absolute;
          inset: 0;
        }
        [data-composition-id="s03-lignes"] .s03-shadow {
          position: absolute;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(40, 30, 20, 1) 0%, rgba(40, 30, 20, 0.55) 55%, rgba(40, 30, 20, 0) 100%);
          mix-blend-mode: multiply;
          opacity: 0.25;
        }
        [data-composition-id="s03-lignes"] .s03-prod {
          position: absolute;
        }
        [data-composition-id="s03-lignes"] .s03-prod img {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
        [data-composition-id="s03-lignes"] .s03-contour {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        [data-composition-id="s03-lignes"] .s03-sheen {
          position: absolute;
          inset: 0;
          -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
          mix-blend-mode: screen;
          overflow: hidden;
        }
        [data-composition-id="s03-lignes"] .s03-band {
          position: absolute;
          top: -20%;
          left: 0;
          width: 26%;
          height: 140%;
          background: linear-gradient(100deg, rgba(255, 250, 238, 0) 0%, rgba(255, 250, 238, 0.75) 50%, rgba(255, 250, 238, 0) 100%);
          opacity: 0;
        }
        [data-composition-id="s03-lignes"] .s03-copy {
          position: absolute;
          color: var(--mn-ink);
        }
        [data-composition-id="s03-lignes"] .s03-num {
          font-family: "Poppins", Arial, sans-serif;
          font-weight: 500;
          font-size: 18px;
          letter-spacing: 0.3em;
          color: #7a5c26; /* ouro escuro: AA sobre marfim */
          margin: 0 0 22px 4px;
        }
        [data-composition-id="s03-lignes"] .s03-title {
          font-size: 88px;
          line-height: 1.05;
          white-space: nowrap;
          padding-bottom: 0.1em;
        }
        [data-composition-id="s03-lignes"] .s03-rule {
          display: block;
          width: 120px;
          height: 2px;
          margin: 26px 0 0 4px;
          background: linear-gradient(90deg, var(--mn-gold-1), var(--mn-gold-2));
          transform-origin: 0 50%;
        }
        [data-composition-id="s03-lignes"] .s03-b3d {
          position: absolute;
          inset: 0;
          perspective: 1400px;
        }
      </style>

      <div id="s03-main" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="s03-iris" id="s03-iris">
          <div class="s03-paper" id="s03-paper"></div>
          <div class="s03-stage" id="s03-stage">
            <!-- Plano A (0–2): rectangulaire argentée cadran bleu -->
            <div id="s03-planA" class="clip" data-start="0" data-duration="2" data-track-index="1">
              <div class="mn-layer" id="s03-camA">
                <div class="s03-shadow" id="s03-shA"></div>
                <div class="s03-prod" id="s03-prodA">
                  <img src="assets/cut/rect_argentee_bleu.png" alt="" />
                  <div class="s03-sheen" id="s03-sheenA"><div class="s03-band" id="s03-bandA"></div></div>
                  <svg class="s03-contour" id="s03-contourA" aria-hidden="true"><path id="s03-pathA" fill="none" stroke="#C9A85E" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" /></svg>
                </div>
              </div>
              <div class="s03-copy" id="s03-copyA" style="left: 1010px; top: 404px">
                <p class="s03-num" id="s03-numA">01</p>
                <h2 class="mn-serif s03-title" id="s03-titleA">Lignes épurées.</h2>
                <span class="s03-rule" id="s03-ruleA"></span>
              </div>
            </div>
            <!-- Plano B (2–4): NF5075 argentée cadran noir -->
            <div id="s03-planB" class="clip" data-start="2" data-duration="2" data-track-index="2">
              <div class="s03-shadow" id="s03-shB"></div>
              <div class="s03-b3d">
                <div class="s03-prod" id="s03-prodB">
                  <img id="s03-b10" src="assets/cut/nf5075_noir_b10.png" alt="" />
                  <img id="s03-b4" src="assets/cut/nf5075_noir_b4.png" alt="" />
                  <img id="s03-b0" src="assets/cut/nf5075_noir.png" alt="" />
                  <div class="s03-sheen" id="s03-sheenB"><div class="s03-band" id="s03-bandB"></div></div>
                </div>
              </div>
              <div class="s03-copy" id="s03-copyB" style="left: 96px; top: 404px">
                <p class="s03-num" id="s03-numB">02</p>
                <h2 class="mn-serif s03-title" id="s03-titleB">Cadrans singuliers.</h2>
                <span class="s03-rule" id="s03-ruleB"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="vendor/gsap.min.js"></script>
      <script src="vendor/SplitText.min.js"></script>
      <script src="vendor/CustomEase.min.js"></script>
      <script src="vendor/DrawSVGPlugin.min.js"></script>
      <script src="vendor/MorphSVGPlugin.min.js"></script>
      <script src="shared/timeline.js"></script>
      <script src="shared/framing.js"></script>
      <script src="shared/paths.js"></script>
      <script src="shared/palette.js"></script>
      <script src="shared/fx.js"></script>
      <script>
        (function () {
          var ID = "s03-lignes";
          MN.init();
          var S = MN.scene(ID);
          var C = S.cue;
          var FR = window.MINORAN_FRAMING;
          var PATHS = window.MINORAN_PATHS;
          var IRIS = window.MINORAN_TL.transitions["s03>s04"].point;

          // posiciona um recorte: altura exibida, ponto do mostrador -> coordenada de tela
          function place(el, key, h, at) {
            var f = FR[key];
            var crop = f.cut.cropPx;
            var s = h / crop[3];
            var w = crop[2] * s;
            var dx = (f.watch.cx * f.size[0] - crop[0]) * s;
            var dy = (f.watch.cy * f.size[1] - crop[1]) * s;
            el.style.width = w + "px";
            el.style.height = h + "px";
            el.style.left = at[0] - dx + "px";
            el.style.top = at[1] - dy + "px";
            return { w: w, h: h, s: s, dx: dx, dy: dy, left: at[0] - dx, top: at[1] - dy };
          }
          function shadow(el, g, k) {
            var sw = g.w * (k || 0.92),
              sh = 46;
            el.style.width = sw + "px";
            el.style.height = sh + "px";
            el.style.left = g.left + (g.w - sw) / 2 + "px";
            el.style.top = g.top + g.h - sh * 0.62 + "px";
          }
          // plano A: pico 1.21 -> exibe a 0.66 do arquivo (0.80 no pico, <= maxScale)
          var A = place(S.q("#s03-prodA"), "rect_argentee_bleu", 640, [640, 520]);
          shadow(S.q("#s03-shA"), A);
          var pA = PATHS.rect_argentee_bleu;
          var svgA = S.q("#s03-contourA");
          svgA.setAttribute("viewBox", "0 0 " + pA.w + " " + pA.h);
          svgA.setAttribute("preserveAspectRatio", "none");
          S.q("#s03-pathA").setAttribute("d", pA.offset || pA.d);
          S.q("#s03-sheenA").style.webkitMaskImage = S.q("#s03-sheenA").style.maskImage = "url(assets/cut/rect_argentee_bleu.png)";
          // plano B: mostrador no ponto da íris (coordenada em timeline.js)
          var B = place(S.q("#s03-prodB"), "nf5075_noir", 690, IRIS);
          shadow(S.q("#s03-shB"), B, 0.8);
          ["#s03-b10", "#s03-b4", "#s03-b0"].forEach(function (q) {
            S.q(q).style.width = "100%";
            S.q(q).style.height = "100%";
          });
          S.q("#s03-sheenB").style.webkitMaskImage = S.q("#s03-sheenB").style.maskImage = "url(assets/cut/nf5075_noir.png)";

          MN.fonts(['400 italic 88px "Instrument Serif"', '500 18px "Poppins"']).then(function () {
            var tl = gsap.timeline({ paused: true });
            var D = S.dur;

            // IN: entra pela direita (x +2200 -> 0, 0.32 s) com blur direcional
            var inn = C("in");
            var defs = MN.defs(S.q("#s03-main"), "s03");
            var bx = MN.blurFilter(defs, "s03-mbx", "x");
            MN.whipIn(tl, S.q("#s03-stage"), { at: inn[0], dur: inn[1] - inn[0], axis: "x", dist: 2200, blur: bx, maxBlur: 70 });
            tl.fromTo("#s03-paper", { opacity: 0 }, { opacity: 0.06, duration: 0.4, ease: "none", immediateRender: true }, 0);

            // ---------- plano A ----------
            var cam = S.q("#s03-camA");
            gsap.set(cam, { transformOrigin: "640px 520px" });
            // deriva lenta de base
            tl.fromTo(S.q("#s03-prodA"), { y: 8 }, { y: -8, duration: 2, ease: "none", immediateRender: true }, 0);
            // contorno real em ouro 2 px (DrawSVG 0.25–1.1)
            var cr = C("contour");
            tl.fromTo("#s03-pathA", { drawSVG: "0%" }, { drawSVG: "100%", duration: cr[1] - cr[0], ease: "mn.inOut", immediateRender: true }, cr[0]);
            tl.to("#s03-pathA", { opacity: 0.55, duration: 0.5, ease: "sine.inOut" }, cr[1] + 0.1);
            // punch-ins nos cues: 1 -> 1.07 -> 1.14 -> 1.21, ±1.5° alternado
            C("punch").forEach(function (t, i) {
              tl.to(cam, { scale: 1 + 0.07 * (i + 1), rotation: i % 2 === 0 ? 1.5 : -1.5, duration: 0.12, ease: "power3.out" }, t);
            });
            MN.glint(tl, S.q("#s03-bandA"), { at: cr[1] + 0.05, dur: 0.8, fromX: -140, toX: 300, peak: 0.9 });
            // texto à direita
            var tA = MN.split(S.q("#s03-titleA"), "words");
            var ta = C("textA");
            tl.fromTo("#s03-numA", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.6, ease: "mn.out", immediateRender: true }, ta);
            MN.splitReveal(tl, tA.chars, { at: ta + 0.08, dur: 0.75, stagger: 0.028 });
            tl.fromTo("#s03-ruleA", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "mn.inOut", immediateRender: true }, ta + 0.3);

            // ---------- plano B (corte seco em 2.0, no tempo forte) ----------
            var pb = C("planB");
            var prodB = S.q("#s03-prodB");
            gsap.set(prodB, { transformOrigin: B.dx + "px " + B.dy + "px" });
            tl.fromTo(prodB, { rotationY: -18 }, { rotationY: 12, duration: D - pb, ease: "sine.inOut", immediateRender: true }, pb);
            tl.fromTo(prodB, { y: 6 }, { y: -6, duration: D - pb, ease: "none", immediateRender: true }, pb);
            // rack focus 2.0–2.5: crossfade entre as versões pré-desfocadas
            var rf = C("rackFocus");
            var rd = rf[1] - rf[0];
            tl.fromTo("#s03-b4", { opacity: 0 }, { opacity: 1, duration: rd * 0.45, ease: "sine.in", immediateRender: true }, rf[0]);
            tl.fromTo("#s03-b10", { opacity: 1 }, { opacity: 0, duration: rd * 0.5, ease: "sine.inOut", immediateRender: true }, rf[0] + rd * 0.35);
            tl.fromTo("#s03-b0", { opacity: 0 }, { opacity: 1, duration: rd * 0.6, ease: "sine.out", immediateRender: true }, rf[0] + rd * 0.4);
            tl.to("#s03-b4", { opacity: 0, duration: rd * 0.4, ease: "sine.out" }, rf[0] + rd * 0.75);
            tl.fromTo("#s03-shB", { opacity: 0.1 }, { opacity: 0.25, duration: rd, ease: "sine.out", immediateRender: true }, rf[0]);
            // faixa de luz deslizando
            MN.glint(tl, S.q("#s03-bandB"), { at: pb + 0.2, dur: 1.4, fromX: -160, toX: 380, peak: 0.5, ease: "sine.inOut" });
            // texto à esquerda
            var tB = MN.split(S.q("#s03-titleB"), "words");
            var tb = C("textB");
            tl.fromTo("#s03-numB", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "mn.out", immediateRender: true }, tb);
            MN.splitReveal(tl, tB.chars, { at: tb + 0.04, dur: 0.6, stagger: 0.022 });
            tl.fromTo("#s03-ruleB", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "mn.inOut", immediateRender: true }, tb + 0.2);
            tl.fromTo("#s03-copyB", { x: 0 }, { x: -12, duration: D - tb, ease: "none", immediateRender: true }, tb);

            // 3.0: textos saem
            var to = C("textOut");
            MN.textOut(tl, tB.chars, { at: to, stagger: 0.012, dur: 0.3 });
            MN.textOut(tl, ["#s03-numB", "#s03-ruleB"], { at: to, stagger: 0, dur: 0.3 });

            // 3.7–4.0: OUT — íris fecha no centro do relógio, sobre tinta
            var out = C("out");
            MN.iris(tl, S.q("#s03-iris"), { at: out[0], dur: out[1] - out[0], cx: IRIS[0], cy: IRIS[1], r0: 1440, r1: 0, ease: "power2.in", immediate: false });

            window.__timelines[ID] = tl;
          });
        })();
      </script>
    </div>
  </body>
</html>
